[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cookiecutter-pyproject"
description = "Project for scaffolding a `python` package or project structure."
version = "1.0.0"
readme = "README.md"
authors = [
  { name = "yakimka", email = "ss.yakim@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0.0"

dependencies = [
  "cookiecutter~=2.6",
]
[dependency-groups]
dev = [
  "flake8>=7.0.0,<8.0.0",
  "pytest>=9.1.1,<9.2.0",
  "tomlkit>=0.13.2,<1.0.0",
  "binaryornot>=0.4.4,<1.0.0",
  "pytest-cookies>=0.7.0,<1.0.0",
]

[tool.poetry]
# This is a cookiecutter template, not an installable package.
package-mode = false
requires-poetry = ">=2.4"

[tool.pytest.ini_options]
# Directories that are not visited by pytest collector:
norecursedirs = [
  "{{cookiecutter.project_name}}",
  "hooks",
  ".git",
  "__pycache__",
]

# Strict `@xfail` by default:
xfail_strict = true

# Extra options:
addopts = [
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--doctest-modules",
]
