name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install poetry
      # The export plugin is pinned here instead of being resolved at run time
      # by `[tool.poetry.requires-plugins]`, so the version is deterministic.
      run: pip install poetry==2.4.1 poetry-plugin-export==1.10.*

    - name: Install dependencies
      run: |
        poetry config virtualenvs.in-project true
        poetry install

    - name: Run checks
      run: |
        poetry run flake8 .
        poetry run pytest
        poetry check
        poetry run pip check
        poetry run sh tests/test_integration.sh
